services:
  frontend:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      VITE_AGENT_URL: http://localhost:5005
    depends_on:
      - agent-orchestrator

  agent-orchestrator:
    build: ./apps/agent-orchestrator
    ports:
      - "5005:5005"
    environment:
      GRAPHQL_URL: http://viaduct-server:8080/graphql
    depends_on:
      - viaduct-server

  viaduct-server:
    build: ./viaduct-server
    ports:
      - "8080:8080"
    environment:
      LOCATION_SERVICE_URL: http://location-service:5101
      PERMITS_SERVICE_URL: http://permits-service:5102
      CIVIC_SERVICE_URL: http://civic-service:5103
      TRANSIT_SERVICE_URL: http://transit-service:5104
      POLICY_SERVICE_URL: http://policy-service:5105
      CENSUS_SERVICE_URL: http://census-service:5106
    depends_on:
      - location-service
      - permits-service
      - civic-service
      - transit-service
      - census-service
      - policy-service

  location-service:
    build: ./services/location-service
    ports:
      - "5101:5101"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  permits-service:
    build: ./services/permits-service
    ports:
      - "5102:5102"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  civic-service:
    build: ./services/civic-service
    ports:
      - "5103:5103"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  transit-service:
    build: ./services/transit-service
    ports:
      - "5104:5104"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  census-service:
    build: ./services/census-service
    ports:
      - "5106:5106"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  policy-service:
    build: ./services/policy-service
    ports:
      - "5105:5105"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - ./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql
