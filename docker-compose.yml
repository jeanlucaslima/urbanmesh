services:
  frontend:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      VITE_AGENT_URL: http://localhost:5005
    depends_on:
      - agent-orchestrator

  agent-orchestrator:
    build: ./apps/agent-orchestrator
    ports:
      - "5005:5005"
    environment:
      GRAPHQL_URL: http://viaduct-server:8080/graphql
    depends_on:
      - viaduct-server

  viaduct-server:
    build: ./viaduct-server
    ports:
      - "8080:8080"
    environment:
      CUSTOMER_SERVICE_URL: http://customer-service:5101
      BILLING_SERVICE_URL: http://billing-service:5102
      SUPPORT_SERVICE_URL: http://support-service:5103
      USAGE_SERVICE_URL: http://usage-service:5104
      POLICY_SERVICE_URL: http://policy-service:5105
    depends_on:
      - customer-service
      - billing-service
      - support-service
      - usage-service
      - policy-service

  customer-service:
    build: ./services/customer-service
    ports:
      - "5101:5101"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  billing-service:
    build: ./services/billing-service
    ports:
      - "5102:5102"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  support-service:
    build: ./services/support-service
    ports:
      - "5103:5103"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  usage-service:
    build: ./services/usage-service
    ports:
      - "5104:5104"
    environment:
      DATABASE_URL: postgres://demo:demo@postgres:5432/demo
    depends_on:
      - postgres

  policy-service:
    build: ./services/policy-service
    ports:
      - "5105:5105"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes:
      - ./data/seed.sql:/docker-entrypoint-initdb.d/seed.sql
